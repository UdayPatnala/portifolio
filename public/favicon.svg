<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Cyan to Teal gradient for U -->
    <linearGradient id="u-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" /> <!-- emerald-500 -->
      <stop offset="100%" stop-color="#06b6d4" /> <!-- cyan-500 -->
    </linearGradient>
    
    <!-- Purple to Pink gradient for K -->
    <linearGradient id="k-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" /> <!-- violet-500 -->
      <stop offset="100%" stop-color="#ec4899" /> <!-- pink-500 -->
    </linearGradient>

    <!-- Glow shadow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glowing background elements for visual depth -->
  <circle cx="50" cy="50" r="42" stroke="url(#u-grad)" stroke-width="1.5" stroke-dasharray="6 3" opacity="0.3" />
  
  <g filter="url(#glow)">
    <!-- U-Path -->
    <path d="M 28 25 L 28 58 A 12 12 0 0 0 52 58 L 52 25" 
          stroke="url(#u-grad)" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
          
    <!-- K-Diagonals -->
    <path d="M 52 43 L 72 23 M 52 43 L 72 63" 
          stroke="url(#k-grad)" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>